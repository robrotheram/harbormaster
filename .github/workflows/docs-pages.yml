name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-pages.yml
      - website/**
      - docs/**
      - CONTRIBUTING.md
      - assets/icon.svg
      - config/README.md
      - deploy/hermes/README.md
      - deploy/kubernetes/README.md
      - deploy/kubernetes/infrastructure/README.md
      - frontend/README.md
      - frontend/DESIGN.md
      - integrations/hermes/README.md
  workflow_dispatch:

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install Hugo
        env:
          HUGO_VERSION: '0.147.9'
          HUGO_SHA256: 96d367bc839b170cfc34470e41844594f4b7846a39e87850b2cb1f8c81b0d11b
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "$HUGO_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build documentation
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --source website --destination "$RUNNER_TEMP/docs-site" --baseURL "${PAGES_BASE_URL%/}/" --minify --panicOnWarning
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
