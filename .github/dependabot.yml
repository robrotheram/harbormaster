version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /dashboard
      - /workspace
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /workspace/hermes
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /workspace
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/firecracker
    schedule:
      interval: weekly
