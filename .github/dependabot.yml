version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /frontend
      - /tools
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /integrations/hermes
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/firecracker
    schedule:
      interval: weekly
