baseURL = 'http://localhost:1313/'
title = 'Harbormaster Docs'
languageCode = 'en'
disableKinds = ['taxonomy', 'term', 'RSS']

[params]
  repository = 'https://github.com/robrotheram/harbormaster'
  archivedDocs = [
    'docs/architecture-direction.md',
    'docs/implementation-contract.md',
    'docs/implementation-contract-2026-11.md',
    'docs/software-factory-plan.md',
    'docs/software-factory-implementation.md',
    'docs/workbench-consolidation.md',
    'docs/reviews/enterprise-ux-2026-11-14.md',
    'docs/reviews/release-readiness-2026-11-14.md',
    'docs/evidence/factory-retained-preview.md',
  ]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  style = 'github-dark'

[mediaTypes.'application/json']
  suffixes = ['json']

[outputFormats.searchIndex]
  mediaType = 'application/json'
  baseName = 'search-index'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'searchIndex']

[module]
  [[module.mounts]]
    source = '../docs/README.md'
    target = 'content/docs/_index.md'
  [[module.mounts]]
    source = '../docs'
    target = 'assets/repository/docs'
    includeFiles = ['*.md', '**/*.md']
  [[module.mounts]]
    source = '../CONTRIBUTING.md'
    target = 'assets/repository/CONTRIBUTING.md'
  [[module.mounts]]
    source = '../config/README.md'
    target = 'assets/repository/config/README.md'
  [[module.mounts]]
    source = '../deploy/hermes/README.md'
    target = 'assets/repository/deploy/hermes/README.md'
  [[module.mounts]]
    source = '../deploy/kubernetes/README.md'
    target = 'assets/repository/deploy/kubernetes/README.md'
  [[module.mounts]]
    source = '../deploy/kubernetes/infrastructure/README.md'
    target = 'assets/repository/deploy/kubernetes/infrastructure/README.md'
  [[module.mounts]]
    source = '../frontend/README.md'
    target = 'assets/repository/frontend/README.md'
  [[module.mounts]]
    source = '../integrations/hermes/README.md'
    target = 'assets/repository/integrations/hermes/README.md'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = '../assets/icon.svg'
    target = 'static/icon.svg'
