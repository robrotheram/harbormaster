# Future adoption only. Not included in the reference overlay or applied by CI.
# Register private repository credentials with Argo CD before syncing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbormaster-reference
  namespace: argocd
  # No cascading-delete finalizer: deleting this Application must retain state.
spec:
  project: default
  source:
    repoURL: https://github.com/robrotheram/harbormaster.git
    targetRevision: main
    path: deploy/kubernetes/overlays/reference
  destination:
    server: https://kubernetes.default.svc
    namespace: harbormaster
  syncPolicy:
    # Deliberately manual: approve the initial adoption diff before enabling automation.
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - FailOnSharedResource=true
