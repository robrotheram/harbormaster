# Fresh single-node reference environment; no existing data is imported.
apiVersion: v1
kind: Namespace
metadata:
  name: workbench-system
  labels:
    app.kubernetes.io/part-of: harbormaster
---
apiVersion: v1
kind: Namespace
metadata:
  name: workbench-egress
  labels:
    app.kubernetes.io/part-of: harbormaster
---
# Explicit class: the cluster has two defaults. Retain protects reference data
# against accidental PVC deletion; it does not replace independent backups.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: harbormaster-retain
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  fsType: ext4
  dataLocality: disabled
  dataEngine: v1
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbormaster-db
  namespace: workbench-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  bootstrap:
    initdb:
      database: workbench
      owner: workbench
  storage:
    size: 10Gi
    storageClass: harbormaster-retain
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  enableSuperuserAccess: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbormaster-tls
  namespace: workbench-system
spec:
  secretName: harbormaster-tls
  dnsNames: [harbormaster.exceptionerror.io]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# Local middleware avoids enabling Traefik cross-namespace references globally.
# The existing oauth2-proxy remains the authentication authority.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harbormaster-auth
  namespace: workbench-system
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth
    trustForwardHeader: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
