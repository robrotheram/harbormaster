# Set the project label and pin the image in the consuming overlay. Provision the named
# Secret out of band with project_signing_key, mcp_token, gateway_service_token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-mcp
  namespace: harbormaster
spec:
  replicas: 1
  selector:
    matchLabels: {app: hermes-mcp}
  template:
    metadata:
      labels:
        app: hermes-mcp
        workbench.role: gateway
        workbench.project: default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: ghcr.io/robrotheram/harbormaster/mcp
          ports: [{containerPort: 8080}]
          env:
            - {name: CONTROLPLANE_URL, value: 'http://controlplane.harbormaster.svc:8080'}
            - {name: HERMES_CONTROLLER_URL, value: 'http://runtime-controller.harbormaster.svc:8080'}
            - {name: MCP_ALLOWED_HOSTS, value: 'hermes-mcp.harbormaster.svc:8080'}
            - {name: PROJECT_SIGNING_KEY_FILE, value: /run/secrets/project_signing_key}
            - {name: MCP_TOKEN_FILE, value: /run/secrets/mcp_token}
            - {name: GATEWAY_SERVICE_TOKEN_FILE, value: /run/secrets/gateway_service_token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret:
            secretName: hermes-mcp-secrets
            defaultMode: 288
            items:
              - {key: project_signing_key, path: project_signing_key}
              - {key: mcp_token, path: mcp_token}
              - {key: gateway_service_token, path: gateway_service_token}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
