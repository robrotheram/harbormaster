apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: harbormaster
spec:
  template:
    spec:
      containers:
      - name: dashboard
        env:
        - name: DASHBOARD_PUBLIC_ORIGIN
          value: https://harbormaster.exceptionerror.io
        - name: OAUTH2_PROXY_AUTH_URL
          value: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth
        - name: OAUTH2_PROXY_PUBLIC_URL
          value: https://oidc.exceptionerror.io
