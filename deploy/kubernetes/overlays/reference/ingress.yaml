apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workbench
  namespace: harbormaster
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth-redirect@kubernetescrd,harbormaster-harbormaster-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - harbormaster.exceptionerror.io
    secretName: harbormaster-tls
  rules:
  - host: harbormaster.exceptionerror.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 8080
