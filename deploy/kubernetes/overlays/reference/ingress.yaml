apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workbench
  namespace: harbormaster
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-oauth-redirect@kubernetescrd,harbormaster-harbormaster-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - harbormaster.exceptionerror.io
    secretName: harbormaster-tls
  rules:
  - host: harbormaster.exceptionerror.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 8080
---
# Native worker origins authenticate with one-use tickets or desktop bearers.
# Do not attach operator OAuth middleware to these origins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared-worker
  namespace: harbormaster
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - ws-shared.harbormaster.exceptionerror.io
    - desktop-ws-shared.harbormaster.exceptionerror.io
    secretName: harbormaster-tls
  rules:
  - host: ws-shared.harbormaster.exceptionerror.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 8080
  - host: desktop-ws-shared.harbormaster.exceptionerror.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 8080
---
# Each preview service has its own capability-authenticated HTTPS origin.
# The dashboard rejects wildcard labels that are not recognized worker/preview hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: previews
  namespace: harbormaster
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - '*.harbormaster.exceptionerror.io'
    secretName: harbormaster-previews-tls
  rules:
  - host: '*.harbormaster.exceptionerror.io'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 8080
