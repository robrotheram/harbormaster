apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: harbormaster-retain
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: '1'
  fsType: ext4
  dataLocality: disabled
  dataEngine: v1
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbormaster-db
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  bootstrap:
    initdb:
      database: workbench
      owner: workbench
  storage:
    size: 10Gi
    storageClass: harbormaster-retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  enableSuperuserAccess: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbormaster-tls
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  secretName: harbormaster-tls
  dnsNames:
  - harbormaster.exceptionerror.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harbormaster-auth
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth
    trustForwardHeader: false
    authResponseHeaders:
    - X-Auth-Request-User
    - X-Auth-Request-Email
