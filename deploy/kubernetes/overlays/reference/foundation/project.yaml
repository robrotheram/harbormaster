apiVersion: v1
kind: Namespace
metadata:
  name: workbench-reference
  labels:
    workbench.project: default
    workbench.security: enforced
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
automountServiceAccountToken: false
imagePullSecrets:
- name: harbormaster-registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-default-deny
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-controller-ingress
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchLabels:
      workbench.project: default
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: workbench-system
      podSelector:
        matchLabels:
          app: runtime-controller
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-project-egress
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchLabels:
      workbench.project: default
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: workbench-egress
      podSelector:
        matchLabels:
          workbench.project: default
          workbench.role: dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: workbench-egress
      podSelector:
        matchLabels:
          workbench.project: default
          workbench.role: gateway
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: workbench-egress
      podSelector:
        matchLabels:
          workbench.project: default
          workbench.role: registry
    ports:
    - protocol: TCP
      port: 8081
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workbench-runtime
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
rules:
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  - create
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workbench-runtime
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
subjects:
- kind: ServiceAccount
  name: runtime-controller
  namespace: workbench-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workbench-runtime
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-quota
  namespace: workbench-reference
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  hard:
    requests.cpu: '4'
    limits.cpu: '4'
    requests.memory: 4Gi
    limits.memory: 4Gi
    requests.storage: 100Gi
    persistentvolumeclaims: '10'
    pods: '4'
