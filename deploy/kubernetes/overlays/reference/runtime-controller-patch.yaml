apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-controller
  namespace: harbormaster
spec:
  template:
    spec:
      containers:
      - name: runtime-controller
        env:
        - name: CLAUDE_MODEL
          value: claude-sonnet-5-5
        - name: CODEX_MODEL
          value: gpt-6.1-sol
        - name: PROVISION_PROJECT_NAMESPACES
          value: 'true'
        - name: REQUIRE_VERIFIED_ISOLATION
          value: 'false'
        - name: KUBERNETES_STORAGE_CLASS
          value: harbormaster-retain
        - name: KUBERNETES_INFERENCE_URL
          value: http://10.43.180.206:8080
        - name: KUBERNETES_BROKER_URL
          value: http://10.43.153.124:8080
        - name: KUBERNETES_EGRESS_URL
          value: http://10.43.51.35:8080
        - name: WORKSPACE_IMAGE
          value: ghcr.io/robrotheram/harbormaster/workspace@sha256:b2327934ee015a993e6acd2cab0403b63152a4bc7755f36cc1ebe2cb30503743
