apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: harbormaster
spec:
  template:
    spec:
      containers:
      - name: controlplane
        env:
        - name: PROVISION_PROJECT_NAMESPACES
          value: 'true'
        - name: SHARED_WORKSPACE_ID
          value: ''
        - name: MEMORY_QUOTA_BYTES
          value: '2147483648'
