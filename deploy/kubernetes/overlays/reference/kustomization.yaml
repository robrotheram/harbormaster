apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- foundation
- ingress.yaml
- user-subscriptions.yaml
- isolated-workers.yaml
components:
- ../../components/hermes
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: harbormaster-registry
- target:
    version: v1
    kind: Service
    name: hermes-mcp
  patch: |-
    - op: add
      path: /spec/clusterIP
      value: 10.43.244.19
