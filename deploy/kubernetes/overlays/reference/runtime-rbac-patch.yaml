apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workbench-runtime
  namespace: harbormaster
rules:
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, create, patch]
- apiGroups: ['']
  resources: [secrets]
  verbs: [create]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [harbormaster-ws-shared-grant, harbormaster-ws-shared-network]
  verbs: [get, patch]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get, list]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list]
