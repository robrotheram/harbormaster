apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: harbormaster
spec:
  template:
    spec:
      containers:
      - name: controlplane
        env:
        - name: SUBSCRIPTION_GATEWAY_TOKEN_FILE
          value: /run/subscription-gateway/gateway_service_token
        volumeMounts:
        - name: subscription-gateway
          mountPath: /run/subscription-gateway
          readOnly: true
      volumes:
      - name: subscription-gateway
        secret:
          secretName: inference-gateway-secrets
          items:
          - key: gateway_service_token
            path: gateway_service_token
