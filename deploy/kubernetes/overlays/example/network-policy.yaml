apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-ingress-controller
  namespace: harbormaster
spec:
  podSelector:
    matchLabels:
      app: dashboard
    matchExpressions:
    - key: workbench.workspace
      operator: DoesNotExist
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: replace-with-ingress-namespace
      podSelector:
        matchLabels:
          app.kubernetes.io/name: replace-with-ingress-controller
    ports:
    - protocol: TCP
      port: 8080
