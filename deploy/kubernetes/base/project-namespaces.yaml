apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbormaster-project-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
rules:
- apiGroups: ['']
  resources: [namespaces, resourcequotas, limitranges, serviceaccounts]
  verbs: [get, create]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, create]
- apiGroups: ['']
  resources: [secrets]
  verbs: [create]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [harbormaster-registry]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbormaster-project-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
subjects:
- kind: ServiceAccount
  name: runtime-controller
  namespace: harbormaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbormaster-project-provisioner
