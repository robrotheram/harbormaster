apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
automountServiceAccountToken: false
imagePullSecrets:
- name: harbormaster-registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-default-deny
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchExpressions:
    - key: workbench.workspace
      operator: Exists
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-controller-ingress
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchExpressions:
    - key: workbench.workspace
      operator: Exists
    matchLabels:
      workbench.project: default
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: harbormaster
      podSelector:
        matchLabels:
          app: runtime-controller
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-project-egress
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchExpressions:
    - key: workbench.workspace
      operator: Exists
    matchLabels:
      workbench.project: default
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: harbormaster
      podSelector:
        matchLabels:
          workbench.project: default
          workbench.role: gateway
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workbench-runtime
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
rules:
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  - create
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - harbormaster-ws-shared-grant
  - harbormaster-ws-shared-network
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workbench-runtime
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
subjects:
- kind: ServiceAccount
  name: runtime-controller
  namespace: harbormaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workbench-runtime
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-quota
  namespace: harbormaster
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  hard:
    # Includes Kata RuntimeClass overhead; the Pod limit enforces one worker.
    requests.cpu: '2'
    limits.cpu: '2'
    requests.memory: 2Gi
    limits.memory: 2Gi
    pods: '1'
  scopeSelector:
    matchExpressions:
    - scopeName: PriorityClass
      operator: In
      values: [harbormaster-workspace]
