apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: harbormaster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: controlplane
  template:
    metadata:
      labels:
        app: controlplane
    spec:
      automountServiceAccountToken: false
      containers:
      - name: controlplane
        image: ghcr.io/robrotheram/harbormaster/controlplane
        ports:
        - containerPort: 8080
        - containerPort: 8443
        env:
        - name: CONTROLLER_URL
          value: http://runtime-controller.harbormaster.svc:8080
        - name: CONTROLPLANE_URL
          value: http://controlplane:8080
        - name: CONTROLPLANE_READ_URL
          value: http://controlplane:8081
        - name: CONTROL_TOKEN_FILE
          value: /run/secrets/control_token
        - name: DASHBOARD_READ_TOKEN
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: dashboard_read_token
              optional: true
        - name: DASHBOARD_HUMAN_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: dashboard_human_signing_key
              optional: true
        - name: PROJECT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: project_signing_key
              optional: true
        - name: CREDENTIAL_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: credential_encryption_key
              optional: true
        - name: SUBSCRIPTION_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: subscription_gateway_token
              optional: true
        - name: GATEWAY_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: controlplane-secrets
              key: gateway_service_token
              optional: true
        - name: SUBSCRIPTION_RESOLVER_CERT_FILE
          value: /run/subscription-resolver/tls.crt
        - name: SUBSCRIPTION_RESOLVER_KEY_FILE
          value: /run/subscription-resolver/tls.key
        - name: CONTROLLER_TOKEN_FILE
          value: /run/secrets/controller_token
        - name: DATABASE_URL_FILE
          value: /run/secrets/database_url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/healthcheck
          timeoutSeconds: 3
        volumeMounts:
        - name: secrets
          mountPath: /run/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: subscription-resolver-tls
          mountPath: /run/subscription-resolver
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: controlplane-secrets
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: subscription-resolver-tls
        secret:
          secretName: subscription-resolver-tls
          optional: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
  namespace: harbormaster
spec:
  selector:
    app: controlplane
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: read
    port: 8081
    targetPort: 8081
  - name: subscriptions
    port: 8443
    targetPort: 8443
