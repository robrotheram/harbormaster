# Onboarding only. This deliberately does NOT start the upstream Matrix gateway:
# its DM exemption must be replaced by a verified project room/sender gate first.
name: workbench-hermes-${PROJECT_ID:?Set the authoritative workbench project ID}
services:
  hermes-project:
    image: ${HERMES_IMAGE:?Set reviewed nousresearch/hermes-agent v0.22.5 image with an immutable sha256 digest}
    command: [--version]
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: '10001'
      HERMES_GID: '10001'
      WORKBENCH_PROJECT_ID: ${PROJECT_ID}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ALLOWED_ROOMS: ${MATRIX_ROOM_ID:-}
      MATRIX_ALLOWED_USERS: ${MATRIX_ALLOWED_USERS:-}
      MATRIX_E2EE_MODE: required
      MATRIX_PROCESS_NOTICES: 'false'
      MATRIX_APPROVAL_REQUIRE_SENDER: 'true'
    volumes:
      - agent-home:/opt/data
    networks: [project-onboarding]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1
    logging:
      driver: none
    labels:
      workbench.project: ${PROJECT_ID}
      workbench.integration: not_configured
volumes:
  agent-home:
    labels:
      workbench.project: ${PROJECT_ID}
      workbench.state: hermes-home
networks:
  project-onboarding:
    internal: true
