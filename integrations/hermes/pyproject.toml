[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-hermes"
version = "0.1.0"
description = "Workspace-scoped integration with the pinned Hermes SDK"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench_hermes = ["*.json"]
