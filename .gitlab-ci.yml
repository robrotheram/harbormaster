workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [verify]

default:
  interruptible: true
  timeout: 20m

go:
  stage: verify
  image: golang:1.27.4-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: workbench_test
    POSTGRES_USER: workbench_test
    POSTGRES_PASSWORD: disposable-ci-only
    TEST_DATABASE_URL: postgres://workbench_test:disposable-ci-only@postgres:5432/workbench_test?sslmode=disable
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  cache:
    key:
      files: [go.sum]
      prefix: go-1.27.4
    paths: [.cache/go-mod/, .cache/go-build/]
  script:
    - go mod download
    - go mod verify
    - make fmt-check build
    - go vet ./...
    - make go-vuln-check
    - go test -race -timeout 10m -coverprofile=coverage.out ./...
    - make postgres-check
  artifacts:
    when: always
    paths: [coverage.out]
    expire_in: 14 days

frontend:
  stage: verify
  image: node:24-bookworm
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: npm-24
    paths: [.npm/]
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run format:check
    - npm test
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run test:browser
  artifacts:
    when: always
    paths: [frontend/artifacts/]
    expire_in: 7 days

python:
  stage: verify
  image: python:3.12-bookworm
  script:
    - make python-check

compose:
  stage: verify
  image: docker:29-cli
  script:
    - docker compose config --quiet
