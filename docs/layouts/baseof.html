<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default "Guides for running, deploying, and developing Harbormaster, an agent workbench for software and research." }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "icon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "docs.css" | relURL }}">
  <script src="{{ "docs.js" | relURL }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="site-bar">
      <a class="brand" href="{{ site.Home.RelPermalink }}">
        <img src="{{ "icon.svg" | relURL }}" width="34" height="34" alt="">
        <span>Harbormaster</span>
      </a>
      <a class="header-docs" href="{{ (site.GetPage "/docs").RelPermalink }}">Docs</a>
      <form class="site-search" role="search" action="{{ (site.GetPage "/search").RelPermalink }}" method="get">
        <label class="visually-hidden" for="site-query">Search docs</label>
        <input id="site-query" type="search" name="q" placeholder="Search docs" required>
        <button type="submit">Search</button>
      </form>
      <a class="repository-link" href="{{ site.Params.repository }}">GitHub</a>
    </div>
  </header>
  {{ block "main" . }}{{ end }}
  <footer class="site-footer">
    <span>Harbormaster documentation</span>
    <a href="{{ site.Params.repository }}/blob/main/LICENSE">MIT license</a>
  </footer>
</body>
</html>
