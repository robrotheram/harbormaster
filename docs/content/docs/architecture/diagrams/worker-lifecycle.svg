><rect x="711" y="294" width="122" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#f0f3f9" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(240, 243, 249);"><text x="711" y="313">Reject stop</text></g></g></g><g data-cell-id="item-21"><g><rect x="711" y="320" width="122" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b4c2d8" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="711" y="339">Busy or unknown</text></g></g></g></g><g data-cell-id="terminate"><g transform="translate(0.5,0.5)"><rect x="466" y="401" width="379" height="80" rx="8" ry="8" fill="#312740" stroke="#997cb3" stroke-width="1.2" pointer-events="all" style="fill: rgb(49, 39, 64); stroke: rgb(153, 124, 179);"/></g><g data-cell-id="item-22"><g><rect x="478" y="409" width="355" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#f0f3f9" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(240, 243, 249);"><text x="478" y="428">Confirm termination</text></g></g></g><g data-cell-id="item-23"><g><rect x="478" y="435" width="355" height="41" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b4c2d8" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="478" y="461">Confirm that the runtime stopped</text></g></g></g></g><g data-cell-id="stop"><g transform="translate(0.5,0.5)"><rect x="466" y="525" width="379" height="66" rx="6.6" ry="6.6" fill="#183432" stroke="#5c9a90" stroke-width="1.2" pointer-events="all" style="fill: rgb(24, 52, 50); stroke: rgb(92, 154, 144);"/></g><g data-cell-id="item-24"><g><rect x="478" y="533" width="355" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#f0f3f9" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(240, 243, 249);"><text x="478" y="552">Record STOPPED</text></g></g></g><g data-cell-id="item-25"><g><rect x="478" y="559" width="355" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b4c2d8" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="478" y="578">Keep the same worker identity, files and history</text></g></g></g></g><g data-cell-id="item-26"><g><path d="M 213.5 214 L 213.5 246.82" fill="none" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(132, 151, 182);"/><path d="M 213.5 255.32 L 209.25 246.82 L 217.75 246.82 Z" fill="#8497b6" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(132, 151, 182); stroke: rgb(132, 151, 182);"/></g></g><g data-cell-id="item-27"><g><path d="M 213.5 323 L 213.5 355.82" fill="none" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(132, 151, 182);"/><path d="M 213.5 364.32 L 209.25 355.82 L 217.75 355.82 Z" fill="#8497b6" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(132, 151, 182); stroke: rgb(132, 151, 182);"/></g></g><g data-cell-id="item-28"><g><path d="M 213.5 432 L 213.5 464.82" fill="none" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(132, 151, 182);"/><path d="M 213.5 473.32 L 209.25 464.82 L 217.75 464.82 Z" fill="#8497b6" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(132, 151, 182); stroke: rgb(132, 151, 182);"/></g></g><g data-cell-id="item-29"><g><path d="M 549.38 214 L 549.39 237 Q 549.4 247 559.4 247 L 566.2 247 Q 573 247 573 257 L 573 275.82" fill="none" stroke="#8497b6" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(132, 151, 182);"/><path d="M 573 284.32 L 568.75 275.82 L 577.25 275.82 Z" fill="#8497b6" stroke="#8497b6" stroke