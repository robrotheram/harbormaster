-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="52" y="310">Record STARTING before the runtime call</text></g></g></g></g><g data-cell-id="launch"><g transform="translate(0.5,0.5)"><rect x="40" y="366" width="347" height="66" rx="6.6" ry="6.6" fill="#312740" stroke="#997cb3" stroke-width="1.2" pointer-events="all" style="fill: rgb(49, 39, 64); stroke: rgb(153, 124, 179);"/></g><g data-cell-id="item-12"><g><rect x="52" y="374" width="323" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#f0f3f9" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(240, 243, 249);"><text x="52" y="393">Launch compute</text></g></g></g><g data-cell-id="item-13"><g><rect x="52" y="400" width="323" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b4c2d8" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="52" y="419">Attach the existing worker storage</text></g></g></g></g><g data-cell-id="ready"><g transform="translate(0.5,0.5)"><rect x="40" y="475" width="347" height="66" rx="6.6" ry="6.6" fill="#312740" stroke="#997cb3" stroke-width="1.2" pointer-events="all" style="fill: rgb(49, 39, 64); stroke: rgb(153, 124, 179);"/></g><g data-cell-id="item-14"><g><rect x="52" y="483" width="323" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#f0f3f9" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(240, 243, 249);"><text x="52" y="502">Ready for work</text></g></g></g><g data-cell-id="item-15"><g><rect x="52" y="509" width="323" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b4c2d8" font-family="Arial" text-anchor="start" font-size="13px" style="fill: rgb(180, 194, 216);"><text x="52" y="528">Apply connections and observe readiness</text></g></g></g></g><g data-cell-id="request"><g transform="translate(0.5,0.